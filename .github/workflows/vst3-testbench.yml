name: SteamMaster EZ Windows VST3
on:
  push:
    branches: ['ez/**', 'experiment/**', 'main']
  workflow_dispatch:

jobs:
  build-ez:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure JUCE and DSP tests
        run: cmake -S . -B build-ez -DSTEAMMASTER_BUILD_VST3=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build SteamMaster EZ and plugin host test
        run: cmake --build build-ez --config Release --target SteamMasterEZ_VST3 steammaster_plugin_host_smoke --parallel 2
      - name: Run JUCE plugin smoke test
        run: ctest --test-dir build-ez -C Release -R SteamMasterPluginHostSmoke --output-on-failure
      - name: Package SteamMaster EZ
        shell: pwsh
        run: |
          $plugin = Get-ChildItem build-ez -Recurse -Directory -Filter 'SteamMaster EZ.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'SteamMaster EZ.vst3 missing' }
          Compress-Archive -Path $plugin.FullName -DestinationPath SteamMaster-EZ-GSSL-Replacement-Windows-VST3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SteamMaster-EZ-GSSL-Replacement-Windows-VST3
          path: SteamMaster-EZ-GSSL-Replacement-Windows-VST3.zip
          if-no-files-found: error
